[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vservx"
dynamic = ["version"]
description = "Agentless monitoring and management for vLLM instances on remote GPU servers."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Starlette's TestClient uses httpx2 when installed.
    "httpx2",
]

[tool.hatch.version]
path = "api/version.py"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
